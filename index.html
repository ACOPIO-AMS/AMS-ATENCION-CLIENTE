function amsDniCambió_(el){
 const actual=String(el.value||'');
 if(el.dataset.amsLastDni===actual)return false;
 el.dataset.amsLastDni=actual;
 el.dataset.amsResolvedDni='';
 el.dataset.amsRequest=String((Number(el.dataset.amsRequest)||0)+1); // invalida respuestas anteriores
 const {fields,extraIndex}=amsDniDependientes_(el.id);
 for(const key of fields){
  const dep=document.getElementById(key);
  if(dep)dep.value=(dep.tagName==='SELECT'?'Seleccione':'');
  if(extraIndex<0)entryDraft[key]='';
 }
 if(extraIndex>=0&&extraPeople[extraIndex]){
  extraPeople[extraIndex].name='';extraPeople[extraIndex].phone='';
 }
 if(el.id==='driverdni'){
  const note=document.getElementById('clientLookupStatus');
  if(note)note.textContent=actual.length===8?'Buscando DNI...':'Ingresa 8 dígitos para consultar. Los datos anteriores fueron limpiados.';
 }
 return true;
}
function numericChanged(el,limit){
 const old=el.value;el.value=old.replace(/\D/g,'').slice(0,limit);
 if(el.value!==old)el.setCustomValidity('');
 if(/^(driverdni|mainDni|extraDni\d+)$/.test(el.id)){
  const changed=amsDniCambió_(el);
  if(changed&&el.value.length===8)void autofillDni(el.id);
 }
}
function clientCatalog(){
const catalog=new Map();
for(const p of [...state.people].reverse()){
 if(!/^\d{8}$/.test(String(p.dni||''))||!p.name||p.name.includes('pendiente'))continue;
 const prior=catalog.get(p.dni)||{};
 catalog.set(p.dni,{...prior,name:p.name,phone:/^\d{9}$/.test(p.phone||'')?p.phone:(prior.phone||''),license:p.license||prior.license||'',licensecat:p.licensecat||prior.licensecat||''});
}
return catalog;
}
async function autofillDni(id){
 const input=document.getElementById(id), dni=input?.value||'';
 if(!input)return;
 if(!/^\d{8}$/.test(dni)){
  amsDniCambió_(input);
  return;
 }
 // Evitar consultas duplicadas al perder foco y preservar correcciones manuales de celular/licencia.
 if(input.dataset.amsResolvedDni===dni)return;
 const request=String((Number(input.dataset.amsRequest)||0)+1);
 input.dataset.amsRequest=request;
 let found=null;
 try{found=await window.AMSCloud?.lookupCatalog?.('dni',dni)}catch(e){console.warn('Consulta de DNI sin respuesta:',e.message)}
 if(!found)found=clientCatalog().get(dni);
 // Si el DNI cambió durante la petición, NO reescribir otros campos.
 if(!document.contains(input)||input.value!==dni||input.dataset.amsRequest!==request)return;
 if(!found){
  const note=document.getElementById('clientLookupStatus');
  if(note&&id==='driverdni')note.textContent='DNI no encontrado. Completa los datos manualmente.';
  return;
 }
 input.dataset.amsResolvedDni=dni;
 const extra=id.match(/^extraDni(\d+)$/);
 const suffix=extra?extra[1]:'';
 const mappings=extra
  ?[['extraName'+suffix,found.name||found.nombres_apellidos],['extraPhone'+suffix,found.phone||found.celular]]
  :id==='driverdni'
   ?[['drivername',found.name||found.nombres_apellidos],['driverphone',found.phone||found.celular],['license',found.license||found.licencia_conducir],['licensecat',found.licensecat||found.categoria]]
   :[['mainName',found.name||found.nombres_apellidos],['mainPhone',found.phone||found.celular]];
 for(const [target,value] of mappings){
  const el=document.getElementById(target);if(!el||!value)continue;
  let normalized = /name/i.test(target)
  ? String(value).toLocaleUpperCase('es-PE')
  : String(value).trim();

// NORMALIZAR CATEGORÍAS DE LICENCIA
if (target === 'licensecat') {

  const clave = normalized
    .toUpperCase()
    .replace(/[^A-Z0-9]/g, '');

  const categorias = {
    AI: 'A-I',
    AIIA: 'A-IIA',
    AIIB: 'A-IIB',
    AIIC: 'A-IIC',
    AIIIA: 'A-IIIA',
    AIIIB: 'A-IIIB',
    AIIIC: 'A-IIIC'
  };

  normalized = categorias[clave] || normalized.toUpperCase();

  // Incorporar categorías que no estén
  // en la lista desplegable.
  if (
    normalized &&
    !Array.from(el.options).some(
      opcion => opcion.value === normalized
    )
  ) {
    el.add(new Option(normalized, normalized));
  }
}
  el.value=normalized;
  if(!target.startsWith('extra'))entryDraft[target]=normalized;
  else{const i=Number(suffix);if(extraPeople[i])extraPeople[i][/Name/.test(target)?'name':'phone']=normalized;}
 }
 const note=document.getElementById('clientLookupStatus');if(note)note.textContent='✓ DNI encontrado. Datos autocompletados, verifica antes de guardar.';
 amsResaltarObligatorios_();
}
function lookupRucIfPresent(id,rucNameId){

 window.AMSCloud?.lookupCatalog?.('ruc',ruc).then(x=>{
  if(!x||el?.value!==ruc)return;
  const field=document.getElementById(rucNameId);if(field)field.value=x.razon_social||'';
 }).catch(e=>console.warn('Consulta RUC:',e.message));
}

function amsISO(value){if(!value)return '';const m=String(value).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;const d=String(value).match(/^(\d{4}-\d{2}-\d{2})/);return d?d[1]:''}
function amsToday(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function amsNextDay(iso){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

function amsNormalizeSampleCode(x){return String(x||'').trim().toUpperCase().replace(/\s+/g,'').replace(/-(A|B)$/,'')}
function amsFindSampleOwner(type,code){
 const key=amsNormalizeSampleCode(code);if(!key)return '';
 const candidates=[];
 for(const r of (state.providerMatrix||[])){const sample=amsNormalizeSampleCode(r.code||r.codigo||r.codigoMuestra||r.codigo_muestra);if(sample===key)candidates.push({name:r.provider||r.proveedor||r.name||'',date:r.date||''})}
 if(['RM','2RM'].includes(String(type).toUpperCase()))for(const p of state.people){
  if(!/remuestreo/i.test(String(p.motive||'')))continue;
  const values=[p.code,p.sampleCode,p.codigo,p.lotCode,p.lot,p.detail,p.detalle,...(Array.isArray(p.lots)?p.lots.flatMap(l=>[l.code,l.codigo,l.detail]):[])].map(amsNormalizeSampleCode);
  if(values.includes(key))candidates.push({name:p.name||'',date:p.entry||''});
 }
 const unique=[...new Set(candidates.map(x=>String(x.name||'').trim()).filter(Boolean))];return unique.length===1?unique[0]:'';
}

// AMS V8.4: consulta autenticada al índice de PROCESOS - GUIAS (A=código, I=proveedor).
// No se exponen claves de importación ni URLs privadas de Apps Script al navegador.
const amsV84CacheLotes_=new Map();
const amsV84Solicitudes_=new Map();
async function amsV84ConsultarLote_(codigo){
  const cached=amsV84CacheLotes_.get(codigo);
  if(cached&&Date.now()-cached.ts<60000)return cached.data;
  const api=String(window.AMS_CONFIG?.catalogUrl||'');
  const token=window.AMSCloud?.token;
  if(!token||!/^https:\/\/[a-z0-9-]+\.supabase\.co\/functions\/v1\/ams-consultas\/?$/.test(api))throw Error('NO_HAY_SESION_DE_CONSULTA');
  const response=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body:JSON.stringify({tipo:'lote',valor:codigo}),cache:'no-store'});
  const result=await response.json();
  if(!response.ok||!result.ok)throw Error(result.error||'ERROR_BUSCANDO_LOTE');
  const data=result.result||null;
  amsV84CacheLotes_.set(codigo,{data,ts:Date.now()});
  return data;
}
async function amsV84AutocompletarLote_(i,origen){
  if(cargoType!=='PR')return;
  const codeEl=document.getElementById('cargoCode'+i),nameEl=document.getElementById('cargoProviderLine'+i),msg=document.getElementById('amsLoteEstado'+i);
  if(!codeEl||!nameEl)return;
  const raw=origen==='nombre'?nameEl.value.trim():codeEl.value.trim();
  const codigo=raw.replace(/\s/g,'');
  if(!/^\d{5}$/.test(codigo))return;
  const seq=(amsV84Solicitudes_.get(i)||0)+1;amsV84Solicitudes_.set(i,seq);
  if(msg)msg.textContent='Consultando lote '+codigo+'…';
  try{
    const result=await amsV84ConsultarLote_(codigo);
    if(amsV84Solicitudes_.get(i)!==seq||!nameEl.isConnected)return;
    if((origen==='nombre'?nameEl.value:codeEl.value).trim().replace(/\s/g,'')!==codigo)return;
    if(result?.ambiguo){if(msg)msg.textContent='Lote con proveedores distintos en la matriz. Verificar manualmente.';return;}
    if(!result?.proveedor){if(msg)msg.textContent='Lote no encontrado en PROCESOS - GUIAS. Ingresa el nombre manualmente.';return;}
    if(origen==='nombre'||!nameEl.value.trim()||nameEl.dataset.autofilled==='1'){
      nameEl.value=String(result.proveedor).toLocaleUpperCase('es-PE');
      nameEl.dataset.autofilled='1';
      nameEl.dataset.loteOrigen=codigo;
      if(msg)msg.textContent='✓ Proveedor encontrado en PROCESOS - GUIAS';
    }else if(msg){msg.textContent='Proveedor encontrado: '+result.proveedor+'. Se conservó el nombre ingresado manualmente.';}
  }catch(err){if(msg&&nameEl.isConnected)msg.textContent='Consulta no disponible: '+(err.message||err)+'. Puedes ingresar el nombre manualmente.';}
}
const amsV84TiemposLote_=new Map();
document.addEventListener('input',e=>{
  const m=/^cargo(Code|ProviderLine)(\d+)$/.exec(e.target.id||'');if(!m||cargoType!=='PR')return;
  const i=Number(m[2]);
  if(m[1]==='ProviderLine')e.target.dataset.autofilled='0';

  if(/^\d{5}$/.test(String(e.target.value||'').trim()))amsV84TiemposLote_.set(e.target.id,setTimeout(()=>amsV84AutocompletarLote_(i,m[1]==='Code'?'codigo':'nombre'),300));
});

function cargoValidation(){if(cargoType==='GE'&&cargoLines.length>5)return 'El formato A4 permite máximo 5 ítems de materiales generales.';const types=cargoTypesFor(cargoType);if(!cargoType)return 'Selecciona el tipo de cargo.';if(cargoType!=='PR'&&(!val('cargoDriver')||val('cargoDriver')==='Seleccionar'))return 'Selecciona un conductor.';for(let i=0;i<cargoLines.length;i++){const x=cargoLines[i],n=i+1;if(!types.includes(x.type))return cargoType==='GE'?'Selecciona un tipo de material válido.':'Ítem '+n+': selecciona un tipo válido.';if(cargoType==='GE'){if(!x.description.trim())return 'Ítem '+n+': falta Descripción.';if(!x.reason.trim())return 'Ítem '+n+': falta Motivo de salida.';if(!x.quantity||!Number.isFinite(Number(x.quantity))||Number(x.quantity)<=0)return 'Ítem '+n+': Cantidad debe ser mayor que cero.';if(!x.unit.trim())return 'Ítem '+n+': falta Unidad de medida.'}else if(!x.code.trim())return 'Ítem '+n+': falta Código.';else if(cargoType==='PR'&&!x.providerName.trim())return 'Ítem '+n+': falta nombre del proveedor.'}return ''}
function persistCargo(status){if(window.AMSCloud?.configured&&!editingCargoNumber)return window.amsCloudPersistCargo(status);syncCargo();const driver=cargoType==='PR'?[...new Set(cargoLines.map(x=>x.providerName).filter(Boolean))].join(' / '):(val('cargoDriver')||''),type=cargoType,lines=cargoLines.map(x=>({...x})),old=editingCargoNumber?state.cargo.find(c=>c.number===editingCargoNumber):null;const num=old?.number||type+'-'+String(Math.max(0,...state.cargo.filter(c=>c.docType===type).map(c=>Number((c.number||'').split('-').pop())||0))+1).padStart(4,'0');const record={number:num,docType:type,name:old?.name||currentSession()?.name||'Sin sesión',driver,providerDni:type==='PR'?cargoProviderDraft.dni:'',providerName:type==='PR'?cargoProviderDraft.name:'',date:old?.date||now(),updated:now(),materialType:type==='GE'?cargoMaterialType:'',lines,guard:old?.guard||currentSession()?.guard||'—',shift:old?.shift||currentSession()?.shift||'—',status};if(old&&cargoStatus(old)==='COMPLETO'){alert('Este documento ya está COMPLETO y no admite modificaciones.');return;}if(old)Object.assign(old,record);else state.cargo.unshift(record);cargoLastSaved=num;editingCargoNumber='';cargoLines=[cargoReset()];cargoMaterialType='';cargoProviderDraft={dni:'',name:''};addLog('Cargo '+num+' · '+status)}
function saveCargo(){syncCargo();const error=cargoValidation();if(error)return alert(error+' Si aún faltan datos, utiliza «Por completar».');const n=editingCargoNumber||cargoType;ask('¿FINALIZAR '+n+' con '+cargoLines.length+' ítem(s)? Esta acción es DEFINITIVA: ya NO podrás editar sus datos. ¿Confirmar?',()=>persistCargo('COMPLETO'))}
function saveCargoDraft(){syncCargo();if(!cargoType)return alert('Selecciona un tipo de cargo.');const n=editingCargoNumber||cargoType;ask('¿Guardar los '+cargoLines.length+' ítem(s) y todos los datos de '+n+' como INCOMPLETO? Podrás volver a editarlo desde el historial sin perder los datos ni cambiar el número.',()=>persistCargo('INCOMPLETO'))}
function editCargo(number){const c=state.cargo.find(x=>x.number===number);if(!c||cargoStatus(c)!=='INCOMPLETO')return alert('Solo pueden completarse cargos incompletos.');cargoType=c.docType;editingCargoNumber=c.number;cargoProviderDraft={dni:'',name:''};cargoMaterialType=c.docType==='GE'?(c.materialType||c.lines?.find(l=>l.type)?.type||''):'';cargoLines=(c.lines||[]).map(x=>({...cargoReset(),...x,type:String(x.type||'').trim().toUpperCase()==='REFERENCIALES'?'REFERENCIAL':x.type}));if(!cargoLines.length)cargoLines=[cargoReset()];active='1.5';render();restoreCargoInputs(c.driver);document.getElementById('cargoDocument')?.scrollIntoView({behavior:'smooth',block:'start'})}
function viewCargo(number){const c=state.cargo.find(x=>x.number===number);if(!c)return alert('No se encontró el cargo.');const general=c.docType==='GE',titles=general?['Descripción','Motivo de salida','Cantidad','Unidad','Observaciones']:['Tipo','Código','Tipo de envase','Peso','Observaciones'];const rows=(c.lines||[]).map(l=>general?[l.description,l.reason,l.quantity,l.unit,l.notes]:[cargoSampleDisplayType(l.type),l.code,cargoSampleContainer(l.type),cargoSampleWeight(l.type),l.notes]);const html=`<h3>${esc(c.number)} · ${esc(cargoCategory(c.docType))}</h3><p><b>Estado:</b> ${cargoStatus(c)}<br><b>Fecha:</b> ${esc(c.date)}<br><b>Responsable:</b> ${esc(c.name)}<br><b>${c.docType==='PR'?'Proveedor':'Conductor'}:</b> ${esc(c.driver||'Pendiente')}${c.docType==='PR'?'<br><b>DNI del proveedor:</b> '+esc(c.providerDni||'—'):''}${general?'<br><b>Tipo de material:</b> '+esc(c.materialType||c.lines?.[0]?.type||'Pendiente'):''}</p>${table(titles,rows.map(r=>r.map(esc)))}`;const d=document.createElement('dialog');d.style.cssText='width:min(1000px,95vw);max-height:85vh;border:0;border-radius:12px;padding:22px';d.innerHTML=html+`<div style="text-align:right;margin-top:15px"><button class="btn secondary" id="closeCargoView">Cerrar</button></div>`;document.body.append(d);d.querySelector('#closeCargoView').onclick=()=>{d.close();d.remove()};d.addEventListener('close',()=>d.remove());d.showModal()}
// Formato de cargo impreso: tipos, envase y peso se derivan automáticamente.
// Los pesos se muestran con su unidad: 500 g para muestras y 3 kg para REFERENCIAL.
function cargoSampleDisplayType(type){
 return String(type||'').trim().toUpperCase()==='REFERENCIALES'?'REFERENCIAL':String(type||'');
}
function cargoSampleContainer(type){
 const t=String(type||'').trim().toUpperCase();
 if(['PPO','RM','2RM','DIRIMENCIA','DUPLICADO'].includes(t))return 'SOBRE MANILA SELLADO';
 if(['RI','2RI','3RI','FACP','REFERENCIAL','REFERENCIALES'].includes(t))return 'BOLSA PLÁSTICA SELLADA';
 return ''; // Para tipos ajenos al catálogo no se asigna envase.
}
function cargoSampleWeight(type){
 const t=String(type||'').trim().toUpperCase();
 if(!t)return '';
 return t==='REFERENCIAL'||t==='REFERENCIALES'?'3 kg':'500 g';
}
function cargoPrintTitle(doc){
 return doc==='CH'?'SALIDA DE MUESTRAS PARA CHALA':doc==='PR'?'SALIDA DE MUESTRAS PARA EL PROVEEDOR':'SALIDA DE MATERIALES GENERALES';
}

function printCargoByNumber(number){
 if(String(number).startsWith('TMP-'))return alert('Cargo pendiente de numeración central. Sincroniza antes de imprimir como documento oficial.');
 const c=state.cargo.find(x=>x.number===number);
 if(!c)return alert('No se encontró el documento.');
 const general=c.docType==='GE',provider=c.docType==='PR';
 if(general&&(c.lines||[]).length>5)return alert('Este formato admite hasta 5 ítems de materiales generales.');
 const w=window.open('','_blank');
 if(!w)return alert('Permite ventanas emergentes para imprimir.');
 const lines=c.lines||[];
 // Cuadro único de 6 columnas para CH y PR. Mantener 8 filas mínimas del modelo.
 const sampleTable=!general?`<div class="cargo-table-frame"><table class="samples">
  <colgroup><col style="width:7%"><col style="width:${provider?'19%':'14%'}"><col style="width:17%"><col style="width:27%"><col style="width:11%"><col style="width:${provider?'19%':'24%'}"></colgroup>
  <thead><tr><th>N.º</th><th>TIPO</th><th>CÓDIGO</th><th>TIPO DE ENVASE</th><th>PESO</th><th>OBSERVACIÓN</th></tr></thead>
  <tbody>${Array.from({length:Math.max(8,lines.length)},(_,i)=>{
   const l=lines[i]||{};
   return `<tr><td>${i+1}</td><td>${esc(cargoSampleDisplayType(l.type))}</td><td>${esc(l.code||'')}</td><td>${esc(l.type?cargoSampleContainer(l.type):'')}</td><td>${esc(l.type?cargoSampleWeight(l.type):'')}</td><td>${esc(l.notes||'')}</td></tr>`;
  }).join('')}</tbody></table></div>`:'';
 // El cuadro de materiales conserva sus columnas y sus cinco ítems originales.
 const materialTable=general?`<div class="material-type"><span class="material-label">TIPO DE MATERIAL:</span><strong class="material-value">${esc(c.materialType||'—')}</strong></div>
  <div class="cargo-table-frame"><table class="materials"><colgroup><col style="width:7%"><col style="width:28%"><col style="width:25%"><col style="width:10%"><col style="width:13%"><col style="width:17%"></colgroup>
   <thead><tr>${['N.º','DESCRIPCIÓN','MOTIVO DE SALIDA','CANT.','UNIDAD','OBSERVACIONES'].map(x=>`<th>${x}</th>`).join('')}</tr></thead>
   <tbody>${Array.from({length:5},(_,i)=>{const l=lines[i]||{};return `<tr><td>${i+1}</td><td>${esc(l.description||'')}</td><td>${esc(l.reason||'')}</td><td>${esc(l.quantity||'')}</td><td>${esc(l.unit||'')}</td><td>${esc(l.notes||'')}</td></tr>`}).join('')}</tbody>
  </table></div>`:'';
 const signature=(label,name,other='')=>`<div class="signature"><div class="sign-line"></div><strong>${esc(label)}</strong><span>${esc(name||'')}</span>${other?`<small>${esc(other)}</small>`:''}</div>`;
 const signatures=`<div class="signatures${provider?' two':''}">
 ${signature('ATENCIÓN AL CLIENTE',c.name||'')}
 ${provider?signature('PROVEEDOR',c.driver||'',c.providerDni?'DNI: '+c.providerDni:''):signature('CONDUCTOR',c.driver||'')}
 ${provider?'':signature('OFICINA COMERCIAL','NOMBRE:')}
 </div>`;
 const html=`<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cargo ${esc(c.number)}</title>
 <style>
 @page{size:A4 portrait;margin:10mm}
 *{box-sizing:border-box}
 html,body{margin:0;padding:0;color:#111;font:10px Arial,Helvetica,sans-serif}
  /* Vista previa: hoja real A4 vertical (210 x 297 mm), contenido con márgenes de 10 mm. */
  body{background:#edf1f5}
  .paper{position:relative;width:210mm;min-height:297mm;padding:10mm;margin:12mm auto 16mm;background:#fff;box-shadow:0 4px 24px #1b2b4040}
  /* Marca visual de corte a media hoja: no forma parte del documento impreso. */
  .cut-guide{position:absolute;top:148.5mm;left:10mm;right:10mm;transform:translateY(-50%);display:flex;align-items:center;gap:2.8mm;pointer-events:none;z-index:2;color:#526477}
  .cut-guide .cut-line{flex:1;border-top:2px dashed #8799aa}
  .cut-guide .cut-scissors{font-family:'Segoe UI Symbol','Apple Symbols',Arial,sans-serif;font-size:27px;line-height:1;transform:rotate(-8deg);display:inline-block}
  @media(max-width:840px){.paper{margin:0 auto 12mm;box-shadow:none}body{overflow-x:auto}}
 .cargo-document{width:100%;min-height:135mm;display:flex;flex-direction:column;gap:0}
 .print-head{display:grid;grid-template-columns:25% 49% 26%;height:25mm;border:1px solid #222;align-items:stretch}
 .logo-panel,.title-panel,.code-panel{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2mm}
 .logo-panel,.title-panel{border-right:1px solid #222}
 .logo-panel img{width:100%;max-height:21mm;object-fit:contain}
 .title-panel{font-size:17px;font-weight:500;line-height:1.25;letter-spacing:0}
 .code-panel{gap:2mm;font-size:12px}
 .code-panel span{font-size:10px;line-height:1.2}
 .code-panel strong{font-size:12px;font-weight:500}
 .print-meta{padding:3mm 1mm 2mm;font-size:11px;line-height:1.4}
 .meta-time{margin-bottom:1mm}
 .meta-row{display:flex;justify-content:space-between;gap:3mm;flex-wrap:wrap}

// AMS V8.2 - UNA SOLA INTERFAZ DE CORRECCIONES. SOLO REGISTROS NUEVOS.
const AMS_V82_CORTE=Date.parse('2026-10-19T17:09:39.783Z');
function amsV82Eligible(entity,item){
 if(!item||!currentSession()?.cloud)return false;
 if(entity==='people')return Number(item.id)>=AMS_V82_CORTE || Number(item.eventId)>=AMS_V82_CORTE;
 if(entity==='cargo'){
  const m=/^(CH|PR|GE)-(\d+)$/.exec(String(item.number||''));
  return !!m&&Number(m[2])>({CH:4,PR:1,GE:27}[m[1]]||0);
 }
 return false;
}
function amsV83Menu(entity,id){
 if(!amsV82Eligible(entity,amsV82Obj(entity,id)))return '';
 const disabled=amsV82Obj(entity,id)?.status==='ANULADO';
 if(disabled)return '';
 const n=esc(String(id));
 return `<select class="ams-v83-action-select" aria-label="Acciones sobre registro ${n}" onchange="amsV83Elegir('${entity}','${n}',this)">
  <option value="">⋯ Acciones</option><option value="EDITAR">✏ Editar</option>
  ${isAdminAMS()?'<option value="ANULAR">🚫 Anular</option><option value="ELIMINAR">🗑 Eliminar</option>':''}
 </select>`;
}
function amsV83Elegir(entity,id,select){
 const action=select.value;select.value='';
 if(action==='EDITAR')amsV82Edit(entity,id);
 if(action==='ANULAR'||action==='ELIMINAR')amsV82Action(entity,id,action);
}
function amsV82Obj(entity,id){return (entity==='people'?state.people:state.cargo).find(x=>String(entity==='people'?x.id:x.number)===String(id));}
function amsV82Field(k,label,value,type='text'){
 const v=esc(value??'');
 return `<label style="display:block;font-size:12px;margin:7px 0;min-width:190px">${esc(label)}<input data-ams-key="${esc(k)}" type="${type}" value="${v}" style="width:100%;font-size:14px;padding:8px;border:1px solid #bfd0df;border-radius:6px"></label>`;
}
function amsV82Modal(title,body,handler){
 let d=document.getElementById('amsV82Dialog');if(d)d.remove();
 d=document.createElement('dialog');d.id='amsV82Dialog';d.style.cssText='width:min(1000px,96vw);max-height:86vh;overflow:auto;border:0;border-radius:14px;padding:22px';
 d.innerHTML=`<h3>${esc(title)}</h3><p class="hint">Modifica solo lo necesario. No se cambia el identificador del registro. Se sincronizará con Supabase y Google Sheets.</p>${body}<div style="display:flex;justify-content:flex-end;gap:12px;margin-top:20px"><button type="button" id="amsV82Cancel" class="btn secondary">Cancelar</button><button type="button" id="amsV82Save" class="btn">Guardar corrección</button></div>`;
 document.body.appendChild(d);d.querySelector('#amsV82Cancel').onclick=()=>d.close();
 d.querySelector('#amsV82Save').onclick=()=>handler(d);
 const dniEditor=d.querySelector('input[data-ams-key="dni"]');
 if(dniEditor)dniEditor.addEventListener('input',()=>{
  for(const key of ['name','phone','license','licensecat']){
   const dep=d.querySelector('[data-ams-key="'+key+'"]');
   if(dep)dep.value='';
  }
 });
 d.addEventListener('close',()=>d.remove());d.showModal();
}
function amsV82Edit(entity,id){
 const rec=amsV82Obj(entity,id);
 if(!amsV82Eligible(entity,rec)||rec?.status==='ANULADO')return alert('Solo se pueden modificar registros nuevos y activos.');
 const peopleKeys=[['name','Nombres y apellidos'],['dni','DNI'],['phone','Celular'],['type','Tipo de persona'],['entry','Fecha y hora de ingreso'],['exit','Fecha y hora de salida'],['motive','Motivo de ingreso'],['plate','Placa'],['zone','Zona'],['license','N.º licencia'],['licensecat','Categoría'],['lots','N.º lotes'],['load','Detalle de carga'],['lotCode','Código lote'],['sacks','N.º sacos'],['guard','Guardia'],['shift','Turno'],['responsible','Responsable']];
 const cargoKeys=[['name','Atención al cliente'],['driver','Conductor / proveedor'],['providerDni','DNI proveedor'],['providerName','Nombre proveedor'],['date','Fecha y hora'],['materialType','Tipo material'],['guard','Guardia'],['shift','Turno']];
 const keys=entity==='people'?peopleKeys:cargoKeys;
 let body=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:8px">${keys.map(([k,label])=>amsV82Field(k,label,rec[k])).join('')}</div>`;
 const lineKeys=[['type','Tipo de muestra/material'],['code','Código'],['providerName','Proveedor ítem'],['description','Descripción'],['reason','Motivo de salida'],['quantity','Cantidad'],['unit','Unidad de medida'],['notes','Observaciones']];
 if(entity==='cargo')body+=`<h4>Ítems existentes (${rec.lines?.length||0})</h4><p class="hint">Se conservan los mismos ítems y su orden para mantener los vínculos con Drive.</p>${(rec.lines||[]).map((x,i)=>`<fieldset data-ams-line="${i}" style="border:1px solid #d0dce9;padding:10px;border-radius:8px;margin-bottom:9px"><legend>Ítem ${i+1}</legend><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px">${lineKeys.map(([k,label])=>amsV82Field(k,label,x[k])).join('')}</div></fieldset>`).join('')}`;
 amsV82Modal('EDITAR '+(entity==='people'?'PERSONA ':'CARGO ')+id,body,d=>{
  const next={...rec};
  for(const [k] of keys){const field=d.querySelector(`[data-ams-key="${k}"]`);next[k]=field?.value.trim()??'';}
  if(entity==='people'){
   if(next.dni&&!/^\d{8}$/.test(next.dni))return alert('DNI: 8 dígitos.');
   if(next.phone&&!/^\d{9}$/.test(next.phone))return alert('Celular: 9 dígitos.');
   if(!next.name)return alert('Nombres y apellidos obligatorios.');
   next.name=next.name.toLocaleUpperCase('es-PE');
  }else{
   next.lines=(rec.lines||[]).map((line,i)=>{
     const box=d.querySelector(`[data-ams-line="${i}"]`),copy={...line};
     for(const [k] of lineKeys)copy[k]=box.querySelector(`[data-ams-key="${k}"]`)?.value.trim()??'';
     return copy;
   });
   if(next.docType==='GE'&&next.lines.some(x=>!x.description||!x.reason||!x.quantity||!x.unit))return alert('Completa descripción, motivo, cantidad y unidad de cada ítem.');
  }
  const changes=keys.some(([k])=>String(rec[k]??'')!==String(next[k]??''))||(entity==='cargo'&&JSON.stringify(rec.lines)!==JSON.stringify(next.lines));
  if(!changes)return alert('No se detectaron modificaciones.');
  if(!confirm('¿Guardar la corrección? Se enviará a Supabase y posteriormente a Google Sheets.'))return;
  Object.assign(rec,next,{updated:now(),modifiedBy:currentSession()?.name||'',modifiedAt:new Date().toISOString()});
  addLog('EDITAR '+entity+' '+id+' por '+(currentSession()?.name||''));
  d.close();save();render();
  alert('Cambio registrado. Comprueba PENDIENTES: 0 y CONFLICTOS: 0 antes de darlo por sincronizado.');
 });
}
function amsV82Action(entity,id,accion){
 if(!isAdminAMS())return alert('Solo el administrador puede anular o eliminar.');
 const rec=amsV82Obj(entity,id);
 if(!amsV82Eligible(entity,rec)||rec?.status==='ANULADO')return alert('Operación no permitida: registro anterior al corte o ya anulado.');
 const motivo=prompt('Motivo obligatorio para '+accion+' el registro '+id+':');
 if(motivo===null)return;
 if(motivo.trim().length<5)return alert('Indica un motivo de al menos 5 caracteres.');
 if(!confirm('¿Confirmas '+accion+' '+entity+' '+id+'? Se conservará el historial de auditoría.'))return;
 const actor=currentSession()?.name||'ADMINISTRADOR';
 if(accion==='ANULAR'){
  rec.status='ANULADO';rec.amsStatus='ANULADO';rec.annulReason=motivo.trim();rec.annulledBy=actor;rec.annulledAt=new Date().toISOString();
 }else if(accion==='ELIMINAR'){
  const arr=entity==='people'?state.people:state.cargo;
  const pos=arr.indexOf(rec);if(pos<0)return;
  arr.splice(pos,1); // Supabase recibe deleted=true por el mecanismo de cambios existente.
 }
 addLog(accion+' '+entity+' '+id+' por '+actor+' · Motivo: '+motivo.trim());
 save();render();
 alert('Operación registrada. Espera confirmación de Supabase y Drive antes de considerarla finalizada.');
}

<style>
#amsLogin{position:fixed;inset:0;z-index:10000;background:linear-gradient(125deg,#0b2b50,#1262a5);display:flex;align-items:center;justify-content:center;padding:20px}
#amsLogin[hidden]{display:none!important}.ams-login-card{background:#fff;border-radius:16px;box-shadow:0 20px 80px #05162b88;padding:30px;width:min(480px,100%)}
.ams-login-card h2{margin:0;color:#0c3059}.ams-login-card p{color:#536a83}.ams-login-card .field{margin:12px 0}.ams-login-card input,.ams-login-card select{width:100%;padding:12px;border:1px solid #c8d8e9;border-radius:8px;font-size:15px}.ams-login-card button{width:100%;margin-top:14px;padding:13px}.ams-login-error{color:#b91c1c;font-weight:bold;min-height:20px}.ams-session-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:white}.ams-session-bar button{background:#fff;color:#0b3763;border:0;border-radius:6px;padding:7px 12px;cursor:pointer}
</style>
<div id="amsLogin" hidden><form class="ams-login-card" onsubmit="return loginAMS(event)"><h2>AMS ACOPIO</h2><p id="amsLoginCaption">Acceso al sistema</p><div class="field"><label>RESPONSABLE *</label><select id="amsLoginName" required><option value="">Seleccione responsable</option><option value="NOHELLY INGA VENTURA">NOHELLY INGA VENTURA</option><option value="CESAR LUQUE OTOYA">CESAR LUQUE OTOYA</option><option value="SAUL SILVA RIOJA">SAUL SILVA RIOJA</option><option value="SUGELLY CONTRERAS CAJA">SUGELLY CONTRERAS CAJA</option><option value="ADMINISTRADOR">ADMINISTRADOR</option></select></div><div class="field" id="amsLoginGuardWrap"><label>GUARDIA *</label><select id="amsLoginGuard"><option value="">Seleccione</option><option>A</option><option>B</option><option>C</option></select></div><div class="field" id="amsLoginShiftWrap"><label>TURNO *</label><select id="amsLoginShift"><option value="">Seleccione</option><option>Día</option><option>Noche</option></select></div><div class="field" id="amsLoginPinWrap" hidden><label>PIN DEL ADMINISTRADOR *</label><input id="amsLoginPin" type="password" inputmode="numeric" minlength="4" maxlength="8" pattern="[0-9]{4,8}" placeholder="4 a 8 dígitos" autocomplete="off"></div><div class="ams-login-error" id="amsLoginError" aria-live="polite"></div><button class="btn" type="submit">Ingresar al sistema</button><p class="hint" id="amsPinHelp"></p></form></div>
<script>
const AMS_OPERATORS=['NOHELLY INGA VENTURA','CESAR LUQUE OTOYA','SAUL SILVA RIOJA','SUGELLY CONTRERAS CAJA'];
function adminRecordsAMS(){
return head('4.4 REGISTROS','Las correcciones operativas se gestionan desde 1.2 HISTORIAL y 1.5 CARGOS. Los históricos anteriores al corte no se modifican.')+
 panel('GESTIÓN DE REGISTROS',`<p>Para corregir personas o ingresos nuevos utiliza <b>1.2 HISTORIAL</b>; para cargos nuevos utiliza <b>1.5 CARGOS</b>. Los cambios quedarán pendientes hasta confirmar Supabase y Drive.</p>${btn('Ir a historial',"setPage('1.2')")}${btn('Ir a cargos',"setPage('1.5')",'secondary')}`)
}
const AMS_SESSION_KEY='ams-demo-active-session-v1',AMS_ADMIN_PIN_KEY='ams-demo-admin-pin-v1';
function currentSession(){try{return JSON.parse(sessionStorage.getItem(AMS_SESSION_KEY)||'null')}catch(e){return null}}
function updateLoginRoleAMS(){
 const admin=document.getElementById('amsLoginName')?.value==='ADMINISTRADOR';
 for(const id of ['amsLoginGuardWrap','amsLoginShiftWrap']){const el=document.getElementById(id);if(el)el.hidden=true}
 const pinWrap=document.getElementById('amsLoginPinWrap'),pin=document.getElementById('amsLoginPin');
 if(pinWrap)pinWrap.hidden=!admin;
 if(pin){pin.required=admin;if(!admin)pin.value=''}
 document.getElementById('amsLoginGuard').required=false;
 document.getElementById('amsLoginShift').required=false;
 const passwd=document.getElementById('amsOperatorPasswordWrap');if(passwd)passwd.hidden=admin;
 const passInput=document.getElementById('amsOperatorPassword');if(passInput){passInput.required=!admin;if(admin)passInput.value=''}
 const caption=document.getElementById('amsLoginCaption'),help=document.getElementById('amsPinHelp');
 if(caption)caption.textContent=admin?'ADMINISTRADOR · INGRESO CON PIN':'INGRESO · USUARIO Y CONTRASEÑA';
 if(help)help.textContent=admin?'Solo PIN de administrador, verificado por Supabase.':'Cada persona ingresa con su clave personal.';
}
document.getElementById('amsLoginName').addEventListener('change',updateLoginRoleAMS);
function updateSessionHeader(){let h=document.querySelector('header');if(!h)return;let bar=document.getElementById('amsSessionBar');if(!bar){bar=document.createElement('div');bar.id='amsSessionBar';bar.className='ams-session-bar';h.appendChild(bar)}const a=currentSession();bar.innerHTML=a?'<span>👤 '+esc(a.name)+(a.role==='admin'?'':' · Guardia '+esc(a.guard)+' · '+esc(a.shift))+'</span><button type="button" onclick="logoutAMS()">Cerrar sesión</button>':''}
function showLoginAMS(){const box=document.getElementById('amsLogin');box.hidden=false;document.getElementById('amsLoginError').textContent='';updateLoginRoleAMS();document.getElementById('amsLoginName').focus()}
function loginAMS(e){
 e.preventDefault();
 if(window.AMSCloud?.configured){window.AMSCloud.loginFromForm();return false;}
 if(window.AMS_CONFIG?.apiUrl){document.getElementById('amsLoginError').textContent='Conexión no disponible. Actualiza la página; no se permite un ingreso local sin autenticar.';return false;}
 const name=document.getElementById('amsLoginName').value.trim(),guard=document.getElementById('amsLoginGuard').value,shift=document.getElementById('amsLoginShift').value,pin=document.getElementById('amsLoginPin').value,error=document.getElementById('amsLoginError');
 const isAdmin=name==='ADMINISTRADOR';
 if(![...AMS_OPERATORS,'ADMINISTRADOR'].includes(name)){error.textContent='Selecciona un responsable válido.';return false}
 if(!isAdmin&&(!['A','B','C'].includes(guard)||!['Día','Noche'].includes(shift))){error.textContent='Selecciona guardia y turno.';return false}
 if(isAdmin){
   if(!/^[0-9]{4,8}$/.test(pin)){error.textContent='El PIN del administrador debe tener entre 4 y 8 dígitos.';return false}
   const existing=localStorage.getItem(AMS_ADMIN_PIN_KEY);
   if(existing&&pin!==existing){error.textContent='PIN incorrecto. No se permite el ingreso.';return false}
   if(!existing)localStorage.setItem(AMS_ADMIN_PIN_KEY,pin);
 }
 sessionStorage.setItem(AMS_SESSION_KEY,JSON.stringify({name,guard:isAdmin?'':guard,shift:isAdmin?'':shift,role:isAdmin?'admin':'operator',started:new Date().toISOString()}));
 active='1.1';document.getElementById('amsLoginPin').value='';document.getElementById('amsLogin').hidden=true;updateSessionHeader();render();return false;
}
async function logoutAMS(){
 if(!confirm('¿Cerrar la sesión actual?'))return;
 try{await window.AMSCloud?.stop?.()}catch(e){console.warn('Cierre remoto no confirmado',e)}
 sessionStorage.removeItem(AMS_SESSION_KEY);
 updateSessionHeader();showLoginAMS();
}
(function initAMSAccess(){if(window.AMS_CONFIG?.apiUrl&&!currentSession()?.cloud){sessionStorage.removeItem(AMS_SESSION_KEY);showLoginAMS();return;}if(currentSession()){if(!currentSession().role){sessionStorage.removeItem(AMS_SESSION_KEY);showLoginAMS()}else{document.getElementById('amsLogin').hidden=true;updateSessionHeader();render()}}else{showLoginAMS()}})();
</script>
<script>
// Navegación por teclado para todos los formularios, incluidos los diálogos.
document.addEventListener('keydown', function(event) {
  if (event.key !== 'Enter' || event.isComposing || event.repeat || event.ctrlKey || event.altKey || event.metaKey || event.shiftKey) return;
  const current = event.target;
  if (!(current instanceof HTMLElement) || !current.matches('input, select, textarea')) return;
  // Conservar Enter en campos multilínea y botones de envío específicos.
  if (current.matches('textarea, input[type="submit"], input[type="button"], input[type="checkbox"], input[type="radio"], input[type="file"]')) return;
  const dialog = current.closest('dialog[open]');
  const scope = dialog || current.closest('form') || current.closest('#amsLogin') || document;
  const controls = Array.from(scope.querySelectorAll('input, select, textarea')).filter(el =>
    !el.disabled && !el.readOnly && el.type !== 'hidden' && el.type !== 'submit' && el.type !== 'button' &&
    el.type !== 'checkbox' && el.type !== 'radio' && el.type !== 'file' &&
    el.getClientRects().length > 0 && getComputedStyle(el).visibility !== 'hidden' &&
    !el.closest('[hidden], [inert]')
  );
  const index = controls.indexOf(current);
  if (index < 0) return;
  event.preventDefault();
  if (index + 1 < controls.length) {
    controls[index + 1].focus();
    if (controls[index + 1].matches('input[type="text"], input[type="number"], input:not([type])')) controls[index + 1].select?.();
  } else {
    // El último casillero conserva el foco; no guarda ni envía sin querer.
    current.blur();
  }
}, true);
</script>

#amsCloudStatus{font-weight:700}
@media(max-width:900px){#amsCloudBar{width:100%;font-size:9px}#amsCloudBar button{font-size:9px;padding:5px}}
@media print{#amsCloudBar{display:none!important}}

</body></html>
